  # =========================
  # AIRFLOW COMMON
  # =========================
  x-airflow-common: &airflow-common
    image: apache/airflow:2.8.1
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-net

  version: "3.8"

  services:

    # =========================
    # DATABASE & BROKER
    # =========================
    postgres:
      image: postgres:13
      container_name: postgres
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: airflow
        POSTGRES_PASSWORD: airflow
        POSTGRES_DB: airflow
      volumes:
        - postgres-db-volume:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U airflow"]
        interval: 5s
        retries: 5
      restart: always
      networks:
        - spark-net

    redis:
      image: redis:7
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        retries: 5
      restart: always
      networks:
        - spark-net

    # =========================
    # AIRFLOW INIT (WAJIB)
    # =========================
    airflow-init:
      image: apache/airflow:2.8.1
      environment:
        <<: *airflow-common-env
      volumes:
        - .:/opt/airflow
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - spark-net
      command: >
        bash -c "airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User
        --role Admin --email admin@example.com"
      restart: "no"

    # =========================
    # AIRFLOW SERVICES
    # =========================
    airflow-webserver:
      <<: *airflow-common
      command: webserver
      ports:
        - "8086:8080"
      depends_on:
        airflow-init:
          condition: service_completed_successfully
      restart: always

    airflow-scheduler:
      <<: *airflow-common
      command: scheduler
      restart: always

    airflow-worker:
      <<: *airflow-common
      command: celery worker
      restart: always

    airflow-triggerer:
      <<: *airflow-common
      command: triggerer
      restart: always

    # =========================
    # KAFKA
    # =========================
    zookeeper:
      image: confluentinc/cp-zookeeper:7.5.0
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
      networks:
        - spark-net

    kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: kafka
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      networks:
        - spark-net

    kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: kafka-ui
      ports:
        - "8085:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      depends_on:
        - kafka
      networks:
        - spark-net

    # =========================
    # AIRBYTE
    # =========================
    airbyte:
      image: airbyte/webapp:0.63.11
      ports:
        - "8000:80"
      networks:
        - spark-net

    # =========================
    # SPARK
    # =========================
    spark-master:
      build: ./docker/spark
      image: custom-spark:3.5.0
      container_name: spark-master
      hostname: spark-master
      command: >
        /opt/spark/bin/spark-class
        org.apache.spark.deploy.master.Master
      ports:
        - "7077:7077"
        - "8082:8080"
      networks:
        - spark-net

    spark-worker:
      build: ./docker/spark
      image: custom-spark:3.5.0
      container_name: spark-worker
      depends_on:
        - spark-master
      command: >
        /opt/spark/bin/spark-class
        org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
      ports:
        - "8081:8081"
      networks:
        - spark-net

    # =========================
    # JUPYTER
    # =========================
    jupyter-spark:
      image: jupyter/pyspark-notebook:latest
      container_name: jupyter_spark
      ports:
        - "8888:8888"
        - "4040:4040"
      volumes:
        - ./work:/home/jovyan/work
      environment:
        - JUPYTER_ENABLE_LAB=yes
        - SPARK_MASTER=spark://spark-master:7077
        - PYSPARK_SUBMIT_ARGS=--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262 pyspark-shell
      depends_on:
        - spark-master
        - kafka
      networks:
        - spark-net
      command: start-notebook.sh --NotebookApp.token=''

    # =========================
    # HADOOP
    # =========================
    namenode:
      image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
      environment:
        CLUSTER_NAME: hadoop
      ports:
        - "9870:9870"
      volumes:
        - hadoop_namenode:/hadoop/dfs/name
      networks:
        - spark-net

    datanode:
      image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
      depends_on:
        - namenode
      volumes:
        - hadoop_datanode:/hadoop/dfs/data
      networks:
        - spark-net

    # =========================
    # MINIO
    # =========================
    minio:
      image: minio/minio
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: minio
        MINIO_ROOT_PASSWORD: minio123
      ports:
        - "9000:9000"
        - "9011:9001"
      volumes:
        - minio-data:/data
      networks:
        - spark-net

    # =========================
    # ELASTICSEARCH
    # =========================
    #elasticsearch:
      #image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
      #environment:
        #discovery.type: single-node
        #xpack.security.enabled: "false"
      #ports:
        #- "9200:9200"
      #volumes:
        #- esdata:/usr/share/elasticsearch/data
      #networks:
        #- spark-net

    # =========================
    # TRINO
    # =========================
    trino:
      image: trinodb/trino:435
      container_name: trino
      ports:
        - "8088:8080"   # beda dari Airflow 8080
      volumes:
        - ./trino/catalog:/etc/trino/catalog
        - trino-data:/data
      depends_on:
        - minio
      networks:
        - spark-net

  volumes:
    postgres-db-volume:
    hadoop_namenode:
    hadoop_datanode:
    minio-data:
    esdata:
    trino-data:

  networks:
    spark-net:
      driver: bridge
